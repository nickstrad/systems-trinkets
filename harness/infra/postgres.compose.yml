services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: trinkets
      POSTGRES_PASSWORD: trinkets
      POSTGRES_DB: trinkets
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinkets -d trinkets"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
