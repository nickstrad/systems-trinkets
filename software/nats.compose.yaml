# NATS server with JetStream for lessons. Start with `make up-nats` from the repo root.
# Connect: nats://localhost:4222 (no auth); monitoring: http://localhost:8222
name: trinkets-nats

services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  nats-data:
