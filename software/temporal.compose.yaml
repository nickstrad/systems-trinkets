# Temporal dev server (CLI `server start-dev`, SQLite) for lessons. Start with
# `make up-temporal` from the repo root. It does not use the repo's PostgreSQL.
# Connect (Go SDK client.Dial): HostPort localhost:7233, Namespace default (no auth)
# Web UI: http://localhost:8233
name: trinkets-temporal

services:
  temporal:
    # Only patch tags are published (no `1` or `1.9`), so pin the patch release.
    image: temporalio/temporal:1.9.1
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --namespace
      - default
      # The image runs as uid 1000 (temporal). A fresh named volume at a path
      # the image does not have (e.g. /data) is root-owned and not writable, so
      # the volume mounts over /home/temporal, which the image owns.
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  temporal-data:
